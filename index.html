<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lux.io Music</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="main-layout">
        <div id="top-player-panel">
            <div id="player-container">
                <div id="player-bg"></div>

                <div id="lyrics-display">
                    <p id="lyric-text">Selecciona una canción...</p>
                </div>

                <div id="share-toast">¡Enlace copiado al portapapeles! 📋</div>

                <div id="player-controls">
                    <div class="time-bar-container">
                        <div class="time-bar" id="time-bar">
                            <div class="time-progress" id="time-progress"></div>
                        </div>
                        <span class="time-text" id="time-text">0:00 / 0:00</span>
                    </div>
                    
                    <div class="controls-bottom-row">
                        <div class="controls-left-group">
                            <button class="btn-control" id="btn-play-pause" title="Play/Pausa">
                                <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                            </button>

                            <div class="nav-buttons-group">
                                <button class="btn-control" id="btn-prev" title="Anterior">
                                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                                </button>
                                <button class="btn-control" id="btn-next" title="Siguiente">
                                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                                </button>
                            </div>
                        </div>

                        <div class="controls-right-group">
                            <button class="btn-control" id="btn-repeat" title="Repetir canción">
                                <svg viewBox="0 0 24 24">
                                    <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
                                </svg>
                            </button>

                            <button class="btn-control" id="btn-share" title="Compartir canción">
                                <svg viewBox="0 0 24 24">
                                    <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/>
                                </svg>
                            </button>

                            <button class="btn-control" id="btn-fullscreen" title="Pantalla completa">
                                <svg id="icon-fullscreen-enter" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                                <svg id="icon-fullscreen-exit" viewBox="0 0 24 24" style="display:none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="current-track-info">
                <div class="track-info-left">
                    <h2 id="current-track-title">Cargando...</h2>
                    <p id="current-track-author">Lux.io Music</p>
                </div>
                <!-- Botón de comentarios (burbuja de cómic rectangular) -->
                <button id="btn-comments" title="Comentarios" aria-label="Abrir comentarios">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H8l-4 4V6c0-1.1.9-2 2-2z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- PANEL DE COMENTARIOS -->
        <div id="comments-panel">
            <div id="comments-list"></div>
        </div>

        <div id="playlist-container">
            <div class="playlist-header-container">
                <h3 class="playlist-title" id="playlist-header">A continuación</h3>
                <div class="playlist-header-actions" id="author-actions" style="display: none;">
                    <button id="btn-share-author" class="btn-author-action" onclick="shareAuthorList()">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                        Compartir lista
                    </button>
                    <button id="btn-reset-filter" class="btn-author-action btn-reset" onclick="clearAuthorFilter()" title="Ver todas las canciones">✕</button>
                </div>
            </div>
            <div id="playlist"></div>
        </div>

        <div id="dev-unlock-trigger" onclick="handleDevTap()">Cargando...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
